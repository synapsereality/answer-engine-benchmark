[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "answer-engine-benchmark"
version = "0.1.2"
description = "Ask ChatGPT, Gemini, Perplexity and Claude your buyers' questions, several times each, and count who they cite."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Synapse Research Ltd" }]
keywords = ["aeo", "geo", "answer-engine-optimization", "llm", "citations", "benchmark", "seo"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = ["requests>=2.28", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://synapsereality.io/open-source/answer-engine-benchmark/"
Documentation = "https://synapsereality.io/open-source/answer-engine-benchmark/"
Repository = "https://github.com/synapsereality/answer-engine-benchmark"
Issues = "https://github.com/synapsereality/answer-engine-benchmark/issues"

[project.scripts]
aeb = "answer_engine_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

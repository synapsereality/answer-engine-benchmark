name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The tests mock every API. No keys are set here, and none are needed.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[test]" "ruff==0.16.9"
      - run: ruff check .
      - run: pytest -q
      - run: aeb check questions/template.yaml --allow-unfilled

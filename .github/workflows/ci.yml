name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The tests mock every API. No keys are set here, and none are needed.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[test]" ruff
      - run: ruff check .
      - run: pytest -q
      - run: aeb check questions/template.yaml --allow-unfilled
